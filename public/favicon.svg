<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="FairShare — F mark">
  <!--
    FairShare mark (concept 03 — the F).
    One custom letter-form in violet oklch(0.63 0.216 292) with one amber
    counter oklch(0.78 0.16 85) that echoes the amber cell on every EFX
    result in the app. Designed to read at 16 px: the F's stem + the amber
    dot carry the brand even when the counter-arms collapse.
  -->
  <rect width="40" height="40" rx="8" fill="oklch(0.145 0.008 285)"/>
  <path
    d="M10 7 L10 33 L14.2 33 L14.2 22.4 L24.4 22.4 L24.4 18.4 L14.2 18.4 L14.2 11.2 L27 11.2 L27 7 Z"
    fill="oklch(0.63 0.216 292)"
  />
  <rect x="20" y="26" width="11" height="3.2" rx="1.2" fill="oklch(0.78 0.16 85)"/>
</svg>
